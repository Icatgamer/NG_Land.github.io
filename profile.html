<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری | NGLand</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
            --primary: #10b981;
            --secondary: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
            --danger: #ef4444;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-sizing: border-box;
            transition: 0.3s;
        }

        header.scrolled { background-color: rgba(11, 15, 25, 0.95); border-bottom-color: var(--primary); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary); text-decoration: none; display: flex; gap: 8px; align-items: center; }
        .nav-center { display: flex; gap: 15px; align-items: center; }
        .nav-right { display: flex; gap: 12px; align-items: center; }
        .badge { background-color: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 13px; display: flex; gap: 6px; border: 1px solid var(--border); }
        .nav-link { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 8px; background-color: #1e293b; border: 1px solid var(--border); transition: 0.2s; }
        .nav-link:hover { border-color: var(--primary); color: var(--primary); }

        .container { max-width: 500px; margin: 130px auto 40px auto; padding: 20px; flex: 1; box-sizing: border-box; width: 100%; text-align: center; }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .avatar { font-size: 64px; margin-bottom: 15px; }
        .username { font-size: 22px; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        .info-row { display: flex; justify-content: space-between; margin: 15px 0; background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; }

        .btn-logout {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
            margin-top: 20px;
        }
        .btn-logout:hover { opacity: 0.9; }

        footer { background-color: #070a12; padding: 20px; text-align: center; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <header id="main-header">
        <a href="index.html" class="logo">⚡ NGLand</a>
        <div class="nav-center">
            <div class="badge">🌐 IP: <span style="color: var(--primary);">lan.9craft.ir:31747</span></div>
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-link">خانه</a>
            <a href="shop.html" class="nav-link">فروشگاه</a>
            <a href="ping.html" class="nav-link">تست پینگ</a>
        </div>
    </header>

    <div class="container">
        <div class="profile-card">
            <div class="avatar">👤</div>
            <div class="username" id="profile-username">کاربر مهمان</div>
            
            <div class="info-row">
                <span>وضعیت حساب:</span>
                <span style="color: var(--primary);">تایید شده (آنلاین)</span>
            </div>
            <div class="info-row">
                <span>سرور اتصال:</span>
                <span>lan.9craft.ir:31747</span>
            </div>

            <button class="btn-logout" onclick="logout()">خروج از حساب کاربری</button>
        </div>
    </div>

    <footer>
        <p>حقوق سایت برای NGLand محفوظ است</p>
        <p>ارتباط با ما : <a href="https://rubika.ir/ng_land_server" target="_blank">rubika.ir/ng_land_server</a></p>
    </footer>

    <script>
        window.addEventListener('scroll', () => {
            document.getElementById('main-header').classList.toggle('scrolled', window.scrollY > 20);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('ngland_user');
            if (!user) {
                window.location.href = 'account.html';
                return;
            }
            document.getElementById('profile-username').innerText = user;
        });

        function logout() {
            localStorage.removeItem('ngland_user');
            alert('از حساب خود خارج شدید.');
            window.location.href = 'account.html';
        }
    </script>
</body>
</html>
