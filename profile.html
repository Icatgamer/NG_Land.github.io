<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری | NGLand</title>
    <style>
        :root {
            --primary: #f39c12;
            --secondary: #d35400;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #2ecc71;
            --danger: #e74c3c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            box-sizing: border-box;
        }

        header {
            background-color: rgba(18, 18, 18, 0.95);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }

        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; align-items: center; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 16px; }
        nav ul li a:hover { color: var(--primary); }

        .profile-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: #2a2a2a;
            border-radius: 50%;
            border: 1px solid var(--primary);
            color: var(--primary);
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }
        .profile-icon:hover { background: var(--primary); color: white; }

        .container {
            max-width: 500px;
            margin: 140px auto 40px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: #2a2a2a;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            border: 2px solid var(--primary);
        }

        h2 { color: var(--primary); margin-top: 0; margin-bottom: 5px; }
        .username-sub { color: #888; font-size: 15px; margin-bottom: 25px; }

        .info-box {
            background: #151515;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: right;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: #aaa; }
        .info-value { color: var(--text-main); font-weight: bold; }

        .btn-logout {
            width: 100%;
            padding: 12px;
            background-color: var(--danger);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover { background-color: #c0392b; }

        footer {
            background-color: #0d0d0d;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #222;
            margin-top: 60px;
            font-size: 14px;
            color: #888;
        }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">NGLand</a>
        <nav>
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="ping.html">تست پینگ</a></li>
                <li><a href="shop.html">فروشگاه</a></li>
                <li>
                    <a href="profile.html" class="profile-icon" title="پروفایل کاربری">👤</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="avatar">👤</div>
        <h2 id="profile-name">پلیر عزیز</h2>
        <div class="username-sub" id="profile-username">@Username</div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">وضعیت حساب:</span>
                <span class="info-value" style="color: var(--accent);">تایید شده (آنلاین)</span>
            </div>
            <div class="info-row">
                <span class="info-label">سرور پیش‌فرض:</span>
                <span class="info-value">lan.9craft.ir:31747</span>
            </div>
            <div class="info-row">
                <span class="info-label">رنک فعلی:</span>
                <span class="info-value" style="color: var(--primary);">پیش‌فرض (Player)</span>
            </div>
        </div>

        <button class="btn-logout" onclick="logout()">خروج از حساب کاربری</button>
    </div>

    <footer>
        <p>حقوق سایت برای NGLand محفوظ است</p>
        <p>ارتباط با ما : <a href="https://rubika.ir/ng_land_server" target="_blank">rubika.ir/ng_land_server</a></p>
    </footer>

    <script>
        // خواندن نام کاربری ذخیره شده در localStorage
        const savedUser = localStorage.getItem('ngland_user');
        if (savedUser) {
            document.getElementById('profile-name').innerText = savedUser;
            document.getElementById('profile-username').innerText = '@' + savedUser;
        }

        function logout() {
            localStorage.removeItem('ngland_user');
            alert('با موفقیت از حساب اربری خارج شدید.');
            window.location.href = 'account.html';
        }
    </script>
</body>
</html>
