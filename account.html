<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کاربری | NGLand</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #131b2e;
            --primary: #10b981;
            --secondary: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 1000;
            box-sizing: border-box;
            transition: 0.3s;
        }

        header.scrolled { background-color: rgba(11, 15, 25, 0.95); border-bottom-color: var(--primary); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        .logo { font-size: 22px; font-weight: bold; color: var(--primary); text-decoration: none; display: flex; gap: 8px; align-items: center; }
        .nav-center { display: flex; gap: 15px; align-items: center; }
        .nav-right { display: flex; gap: 12px; align-items: center; }
        .badge { background-color: #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 13px; display: flex; gap: 6px; border: 1px solid var(--border); }
        .nav-link { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 8px; background-color: #1e293b; border: 1px solid var(--border); transition: 0.2s; }
        .nav-link:hover { border-color: var(--primary); color: var(--primary); }

        .container { max-width: 450px; margin: 130px auto 40px auto; padding: 20px; flex: 1; box-sizing: border-box; width: 100%; }

        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .auth-title { font-size: 22px; color: var(--primary); text-align: center; margin-bottom: 25px; font-weight: bold; }

        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .form-group input {
            width: 100%;
            background-color: #1e293b;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: var(--primary); }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn:hover { background-color: var(--secondary); }

        .forgot-link { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted); text-decoration: none; }
        .forgot-link:hover { color: var(--primary); }

        footer { background-color: #070a12; padding: 20px; text-align: center; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); }
        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <header id="main-header">
        <a href="index.html" class="logo">⚡ NGLand</a>
        <div class="nav-center">
            <div class="badge">🌐 IP: <span style="color: var(--primary);">lan.9craft.ir:31747</span></div>
        </div>
        <div class="nav-right">
            <a href="index.html" class="nav-link">خانه</a>
            <a href="shop.html" class="nav-link">فروشگاه</a>
            <a href="ping.html" class="nav-link">تست پینگ</a>
        </div>
    </header>

    <div class="container">
        <div class="auth-card">
            <div class="auth-title">ورود / ثبت‌نام در سرور</div>
            <div class="form-group">
                <label>نام کاربری ماینکرفت (Minecraft Username)</label>
                <input type="text" id="username" placeholder="مثال: lcatgamer">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
            </div>
            <button class="btn" onclick="handleAuth()">ورود یا ثبت‌نام</button>
            <a href="https://rubika.ir/joing/+BBGAGJDHJ0SVGUNWTSUOTVSIRBCALFUF" class="forgot-link" target="_blank">رمز عبور خود را فراموش کرده‌اید؟</a>
        </div>
    </div>

    <footer>
        <p>حقوق سایت برای NGLand محفوظ است</p>
        <p>ارتباط با ما : <a href="https://rubika.ir/ng_land_server" target="_blank">rubika.ir/ng_land_server</a></p>
    </footer>

  <script>
    window.addEventListener('scroll', () => {
        const header = document.getElementById('main-header');
        if(header) header.classList.toggle('scrolled', window.scrollY > 20);
    });

    function handleAuth() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            alert('لطفاً نام کاربری و رمز عبور را وارد کنید.');
            return;
        }

        let users = JSON.parse(localStorage.getItem('ngland_users_db')) || {};

        if (users[username]) {
            if (users[username] === password) {
                alert('خوش آمدید! ورود موفقیت‌آمیز بود.');
                // هماهنگ شده با پروفایل:
                localStorage.setItem('current_session', username); 
                window.location.href = 'profile.html';
            } else {
                alert('رمز عبور اشتباه است!');
            }
        } else {
            users[username] = password;
            localStorage.setItem('ngland_users_db', JSON.stringify(users));
            // هماهنگ شده با پروفایل:
            localStorage.setItem('current_session', username); 
            alert('اکانت جدید با موفقیت ساخته شد! اکنون وارد شدید.');
            window.location.href = 'profile.html';
        }
    }
</script>
</body>
</html>
