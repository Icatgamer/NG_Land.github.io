<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب کاربری | NGLand</title>
    <style>
        :root {
            --primary: #f39c12;
            --secondary: #d35400;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #2ecc71;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            box-sizing: border-box;
        }

        header {
            background-color: rgba(18, 18, 18, 0.95);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }

        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; align-items: center; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 16px; }
        nav ul li a:hover { color: var(--primary); }

        .profile-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 35px;
            height: 35px;
            background: #2a2a2a;
            border-radius: 50%;
            border: 1px solid var(--primary);
            color: var(--primary);
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }
        .profile-icon:hover { background: var(--primary); color: white; }

        .container {
            max-width: 450px;
            margin: 140px auto 40px auto;
            padding: 30px;
            background-color: var(--card-bg);
            border-radius: 12px;
            border: 1px solid #333;
            text-align: right;
        }

        h2 { color: var(--primary); text-align: center; margin-top: 0; margin-bottom: 25px; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #151515;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover { background-color: var(--secondary); }

        .forgot-pass {
            text-align: left;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        .forgot-pass a {
            font-size: 13px;
            color: #aaa;
            text-decoration: none;
        }

        .forgot-pass a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        .toggle-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background-color: #0d0d0d;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #222;
            margin-top: 60px;
            font-size: 14px;
            color: #888;
        }

        footer a { color: var(--primary); text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">NGLand</a>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">خانه</a></li>
                <li><a href="ping.html">تست پینگ</a></li>
                <li><a href="shop.html">فروشگاه</a></li>
                <li id="auth-nav-item"><a href="account.html" style="color: var(--primary);">حساب کاربری</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 id="form-title">ورود به حساب کاربری</h2>
        
        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>نام کاربری ماینکرفت (Username)</label>
                <input type="text" id="username" required placeholder="مثال: LCatGamer">
            </div>

            <div class="form-group" id="pass-group">
                <label>رمز عبور</label>
                <input type="password" id="password" required placeholder="رمز عبور خود را وارد کنید">
            </div>

            <div class="forgot-pass" id="forgot-container">
                <a href="https://rubika.ir/joing/+BBGAGJDHJ0SVGUNWTSUOTVSIRBCALFUF" target="_blank">آیا رمز خود را فراموش کرده‌اید؟</a>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">ورود</button>
        </form>

        <div class="toggle-text">
            <span id="toggle-msg">حساب کاربری ندارید؟</span> 
            <a href="#" id="toggle-link" onclick="toggleMode(event)">ثبت‌نام کنید</a>
        </div>
    </div>

    <footer>
        <p>حقوق سایت برای NGLand محفوظ است</p>
        <p>ارتباط با ما : <a href="https://rubika.ir/ng_land_server" target="_blank">rubika.ir/ng_land_server</a></p>
    </footer>

    <script>
        let isLogin = true;

        // بررسی اینکه آیا کاربر قبلاً لاگین کرده است یا خیر
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('ngland_user');
            if (savedUser) {
                // اگر لاگین بود، منو را به آیکون پروفایل تبدیل کن
                document.getElementById('auth-nav-item').innerHTML = '<a href="profile.html" class="profile-icon" title="پروفایل کاربری">👤</a>';
            }
        });

        function toggleMode(e) {
            e.preventDefault();
            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const toggleMsg = document.getElementById('toggle-msg');
            const toggleLink = document.getElementById('toggle-link');
            const forgotContainer = document.getElementById('forgot-container');

            if (isLogin) {
                title.innerText = 'ورود به حساب کاربری';
                btn.innerText = 'ورود';
                toggleMsg.innerText = 'حساب کاربری ندارید؟';
                toggleLink.innerText = 'ثبت‌نام کنید';
                forgotContainer.style.display = 'block';
            } else {
                title.innerText = 'ثبت‌نام در NGLand';
                btn.innerText = 'ثبت‌نام';
                toggleMsg.innerText = 'قبلاً ثبت‌نام کرده‌اید؟';
                toggleLink.innerText = 'وارد شوید';
                forgotContainer.style.display = 'none';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            
            // ذخیره نام کاربری در حافظه مرورگر
            localStorage.setItem('ngland_user', username);

            if (isLogin) {
                alert(`خوش آمدید ${username}! ورود با موفقیت انجام شد.`);
            } else {
                alert(`حساب کاربری برای ${username} با موفقیت ساخته شد!`);
            }

            // هدایت به صفحه پروفایل
            window.location.href = 'profile.html';
        }
    </script>
</body>
</html>
