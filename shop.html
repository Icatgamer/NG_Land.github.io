<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه | NGLand</title>
    <style>
        :root {
            --primary: #f39c12;
            --secondary: #d35400;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #2ecc71;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        header {
            background-color: rgba(18, 18, 18, 0.95);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }

        nav ul { list-style: none; display: flex; gap: 20px; margin: 0; padding: 0; }
        nav ul li a { color: var(--text-main); text-decoration: none; font-weight: 600; }

        .container {
            max-width: 1200px;
            margin: 120px auto 40px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        .section-title {
            grid-column: span 2;
            font-size: 30px;
            color: var(--primary);
            text-align: right;
            margin-bottom: 20px;
            border-right: 5px solid var(--primary);
            padding-right: 15px;
        }

        /* شبکه محصولات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover { 
            border-color: var(--primary); 
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .product-card h3 { color: var(--primary); margin: 10px 0; font-size: 22px; }
        .price { font-size: 24px; font-weight: bold; color: var(--accent); margin: 15px 0; }
        
        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn-add:hover { background-color: var(--secondary); }

        /* سبد خرید */
        .cart-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .cart-item button {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: var(--primary);
            padding-top: 10px;
            border-top: 2px solid #333;
        }

        .btn-checkout {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .section-title { grid-column: span 1; }
            .cart-container { position: static; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">NGLand</a>
        <nav>
            <ul>
                <li><a href="index.html">خانه</a></li>
                <li><a href="shop.html">فروشگاه</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">فروشگاه رنک‌های NGLand</h2>

        <!-- محصولات (رنک‌ها) -->
        <div class="products-grid" id="products-list">
            <!-- رنک‌ها با قیمت‌های شما -->
            <div class="product-card">
                <h3>اسپانسر</h3>
                <div class            class="price">600,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک اسپانسر', 600000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>پویزن</h3>
                <div class="price">150,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک پویزن', 150000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>نایتمر</h3>
                <div class="price">170,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک نایتمر', 170000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>پیکسل</h3>
                <div class="price">99,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک پیکسل', 99000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>پی گاد</h3>
                <div class="price">110,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک پی گاد', 110000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>کیلیر</h3>
                <div class="price">70,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک کیلیر', 70000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>لجند</h3>
                <div class="price">60,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک لجند', 60000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>الیت</h3>
                <div class="price">50,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک الیت', 50000)">افزودن به سبد</button>
            </div>

            <div class="product-card">
                <h3>VIP</h3>
                <div class="price">30,000 <small>تومان</small></div>
                <button class="btn-add" onclick="addToCart('رنک VIP', 30000)">افزودن به سبد</button>
            </div>
        </div>

        <!-- سبد خرید -->
        <div class="cart-container">
            <h3 style="margin-top: 0; color: var(--primary);">🛒 سبد خرید شما</h3>
            <div id="cart-items">
                <p style="color: #777; font-size: 14px; text-align: center;">سبد خرید خالی است</p>
            </div>
            
            <div class="cart-total">
                <span>جمعاً:</span>
                <span id="total-price">0</span>
            </div>

            <button class="btn-checkout" onclick="checkout()">پرداخت نهایی</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsElement = document.getElementById('cart-items');
            const totalPriceElement = document.getElementById('total-price');
            
            if (cart.length === 0) {
                cartItemsElement.innerHTML = '<p style="color: #777; font-size: 14px; text-align: center;">سبد خرید خالی است</p>';
                totalPriceElement.innerText = '0';
                return;
            }

            cartItemsElement.innerHTML = '';
            total = 0;

            cart.forEach((item, index) => {
                total += item.price;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <span>${item.price.toLocaleString()} <button onclick="removeItem(${index})">✕</button></span>
                `;
                cartItemsElement.appendChild(div);
            });

            totalPriceElement.innerText = total.toLocaleString() + ' تومان';
        }

        function removeItem(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout() {
            if (cart.length === 0) {
                alert("سبد خرید شما خالی است!");
                return;
            }
            let itemsList = cart.map(i => i.name).join(', ');
            alert("درخواست خرید ثبت شد!\nمحصولات: " + itemsList + "\nمبلغ قابل پرداخت: " + total.toLocaleString() + " تومان\n\nلطفاً برای تکمیل پرداخت با ادمین در روبیکا در ارتباط باشید.");
        }
    </script>
</body>
</html>
